[project]
name = "nas-subtitles"
version = "0.1.0"
description = "Offline subtitle generation for a local media library (ASR + local translation)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Marcelo Guimaraes" }]
dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "faster-whisper",
    "argostranslate",
    "srt",
    "torch==2.14.1+cpu; sys_platform == 'linux'",
    "torch==2.14.1; sys_platform == 'darwin'",
]

[project.scripts]
nas-subs = "nas_subtitles.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nas_subtitles"]

[tool.hatch.build.targets.wheel.force-include]
"src/nas_subtitles/migrations/001_initial.sql" = "nas_subtitles/migrations/001_initial.sql"
"src/nas_subtitles/migrations/002_execution_scope.sql" = "nas_subtitles/migrations/002_execution_scope.sql"
"src/nas_subtitles/migrations/003_target_language.sql" = "nas_subtitles/migrations/003_target_language.sql"
"src/nas_subtitles/migrations/004_job_kind.sql" = "nas_subtitles/migrations/004_job_kind.sql"
"src/nas_subtitles/static/index.html" = "nas_subtitles/static/index.html"
"src/nas_subtitles/static/dashboard.css" = "nas_subtitles/static/dashboard.css"
"src/nas_subtitles/static/js/app.js" = "nas_subtitles/static/js/app.js"
"src/nas_subtitles/static/js/api-client.js" = "nas_subtitles/static/js/api-client.js"
"src/nas_subtitles/static/js/utils/format.js" = "nas_subtitles/static/js/utils/format.js"
"src/nas_subtitles/static/js/utils/poll.js" = "nas_subtitles/static/js/utils/poll.js"
"src/nas_subtitles/static/js/utils/ui.js" = "nas_subtitles/static/js/utils/ui.js"
"src/nas_subtitles/static/js/pages/overview.js" = "nas_subtitles/static/js/pages/overview.js"
"src/nas_subtitles/static/js/pages/jobs.js" = "nas_subtitles/static/js/pages/jobs.js"
"src/nas_subtitles/static/js/pages/job-detail.js" = "nas_subtitles/static/js/pages/job-detail.js"
"src/nas_subtitles/static/js/pages/settings.js" = "nas_subtitles/static/js/pages/settings.js"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = [
    "B008", # Typer relies on function calls (typer.Option) in argument defaults.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["argostranslate.*", "faster_whisper.*", "srt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "models: requires real ASR/translation model files on disk (never runs offline-only CI)",
    "integration: exercises several modules together with fake engines and synthetic fixtures",
]

[tool.coverage.run]
source = ["nas_subtitles"]
branch = true

# NAS and CPU-only Docker builds must not pull CUDA/NVIDIA/Triton via Torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[project]
name = "nas-subtitles"
version = "0.1.0"
description = "Offline subtitle generation for a local media library (ASR + local translation)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Marcelo Guimaraes" }]
dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "faster-whisper",
    "argostranslate",
    "srt",
]

[project.scripts]
nas-subs = "nas_subtitles.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nas_subtitles"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = [
    "B008", # Typer relies on function calls (typer.Option) in argument defaults.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["argostranslate.*", "faster_whisper.*", "srt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "models: requires real ASR/translation model files on disk (never runs offline-only CI)",
    "integration: exercises several modules together with fake engines and synthetic fixtures",
]

[tool.coverage.run]
source = ["nas_subtitles"]
branch = true
